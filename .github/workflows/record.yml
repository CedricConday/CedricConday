name: Rebuild profile record

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild README record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_record.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/data/record.json
          git commit -m "chore: rebuild profile record"
          git push
